[project]
name = "video-insertion"
version = "0.1.0"
description = "A modular pipeline for object-aware video insertion."
authors = [
    { name = "Your Name", email = "your@email.com" }
]
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "torch",
    "torchvision",
    "opencv-python",
    "numpy",
    "matplotlib",
    "tqdm",
    "pillow",
    "pyyaml",
    "scikit-image",
    "scikit-learn",
    "transformers",
    "sentence-transformers",
    "clip",
    "supervision>=0.26.1",
    "ultralytics>=8.3.170",
    "detectron2",
    "timm>=1.0.19",
    "pydantic>=2.11.7",
    "accelerate>=1.10.0",
    "google-generativeai>=0.8.5",
    "python-dotenv>=1.1.1",
    "sam>=5.0.0",
    "segment-anything",
]

[project.optional-dependencies]
dev = [
    "black",
    "pytest",
    "isort",
    "pre-commit"
]

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["modules*"]
exclude = ["data*", "tests*", "scripts*"]

[tool.uv.sources]
clip = { git = "https://github.com/openai/CLIP.git" }
detectron2 = { git = "https://github.com/facebookresearch/detectron2.git" }
segment-anything = { git = "https://github.com/facebookresearch/segment-anything.git" }

